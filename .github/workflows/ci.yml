# Lab 12 CI workflow — runs on every push and PR to any branch.
# Two jobs:
# 1. lint — ruff check (style + import order + obvious bugs)
# 2. test — pytest on the smoke tests in tests/
# Both run on the free GitHub-hosted ubuntu-latest x86 runner.
# The Docker build (Step 3) and on-device pull (Step 4) come later.

name: CI

on:
  push:
    branches: ["**"] # Chạy trên mọi nhánh khi có push
  pull_request:
    branches: [main] # Chạy khi có PR vào nhánh main

jobs:
  lint:
    name: Ruff lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install ruff
        run: pip install ruff==0.6.9

      - name: Run ruff
        # --output-format=github giúp hiển thị lỗi trực tiếp trên giao diện PR diff
        run: ruff check . --output-format=github

  test:
    name: Pytest smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install test deps
        # Chỉ cài đặt pytest vì các thư viện trong requirements.txt thường yêu cầu ARM64/CUDA
        run: pip install pytest==8.3.3

      - name: Run pytest
        run: pytest tests/ -v

build:
  name: Build & push ARM64 image
  runs-on: ubuntu-latest
  needs: [lint, test] # Chỉ build nếu lint và test đã pass
  permissions:
    contents: read
    packages: write # Cấp quyền để đẩy image lên ghcr.io
  steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up QEMU
      # Cho phép runner x86 thực thi các lệnh aarch64 (giả lập) trong quá trình build
      uses: docker/setup-qemu-action@v3
      with:
        platforms: arm64

    - name: Set up Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GHCR
      # GITHUB_TOKEN được tự động cung cấp, dùng để xác thực với GitHub Packages
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Compute image tags
      id: meta
      # Gắn tag image dựa trên SHA, tên nhánh, hoặc số PR. Nhánh main sẽ có thêm tag :latest
      uses: docker/metadata-action@v5
      with:
        images: ghcr.io/${{ github.repository }}
        tags: |
          type=sha,format=short
          type=ref,event=branch
          type=ref,event=pr
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push
      uses: docker/build-push-action@v5
      with:
        context: .
        file: Dockerfile.ci
        platforms: linux/arm64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        # Sử dụng cache của GitHub Actions để tăng tốc độ build cho những lần sau
        cache-from: type=gha
        cache-to: type=gha,mode=max