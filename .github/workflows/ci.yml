# Lab 12 CI workflow — runs on every push and PR to any branch.
# Two jobs:
# 1. lint — ruff check (style + import order + obvious bugs)
# 2. test — pytest on the smoke tests in tests/
# Both run on the free GitHub-hosted ubuntu-latest x86 runner.
# The Docker build (Step 3) and on-device pull (Step 4) come later.

name: CI

on:
  push:
    branches: ["**"] # Chạy trên mọi nhánh khi có push
  pull_request:
    branches: [main] # Chạy khi có PR vào nhánh main

jobs:
  lint:
    name: Ruff lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install ruff
        run: pip install ruff==0.6.9

      - name: Run ruff
        # --output-format=github giúp hiển thị lỗi trực tiếp trên giao diện PR diff
        run: ruff check . --output-format=github

  test:
    name: Pytest smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install test deps
        # Chỉ cài đặt pytest vì các thư viện trong requirements.txt thường yêu cầu ARM64/CUDA
        run: pip install pytest==8.3.3

      - name: Run pytest
        run: pytest tests/ -v